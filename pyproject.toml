[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "derivopt"
version = "0.1.0"
description = "Budget-aware physical-field selection for autoregressive neural PDE simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "scipy>=1.14,<2", "h5py>=3.12,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
derivopt = "derivopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
